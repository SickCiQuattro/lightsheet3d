name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]  # il minimo supportato e la versione di sviluppo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  notebooks:
    name: Notebooks run end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Execute the notebooks
        run: uv run python -m nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/notebooks" notebooks/*.ipynb
      - uses: actions/upload-artifact@v7
        with:
          name: figures
          path: docs/figures
