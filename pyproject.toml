[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightsheet3d"]

[project]
name = "light-sheet-3d-scanner"
version = "0.1.0"
description = "Scanner 3D a lama di luce: calibrazione camera, calibrazione del piano laser e triangolazione di profili."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "ipykernel>=7",
    "nbclient>=0.11",
    "nbconvert>=7.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
